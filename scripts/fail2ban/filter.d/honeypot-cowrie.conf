# Installed by honeypot-dashboard/scripts/install-host.sh.
# Any connection to Cowrie counts: nobody legitimate talks to the honeypot.
# Cowrie writes one JSON object per line, src_ip before eventid.
[Definition]
failregex = ^\{.*"src_ip":\s*"<HOST>".*"eventid":\s*"cowrie\.(?:session\.connect|login\.(?:failed|success))"
ignoreregex =
datepattern = "timestamp":\s*"%%Y-%%m-%%dT%%H:%%M:%%S
