# Installed by honeypot-dashboard/scripts/install-host.sh.
# Bans through /usr/local/sbin/honeypot-ban.sh: one hp-<name> chain per jail,
# reached from INPUT and DOCKER-USER. scope=services keeps the honeypot open to
# the banned address, scope=all closes everything.
[Definition]
actionstart = /usr/local/sbin/honeypot-ban.sh start <name> <scope>
actionstop = /usr/local/sbin/honeypot-ban.sh stop <name>
actioncheck =
actionban = /usr/local/sbin/honeypot-ban.sh ban <name> <ip>
actionunban = /usr/local/sbin/honeypot-ban.sh unban <name> <ip>

[Init]
name = default
scope = services
