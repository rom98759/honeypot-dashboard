# Overrides only: everything not set here keeps the Cowrie default.
# Mounted read-only over etc/cowrie.cfg by docker-compose.yml.

[honeypot]
# The Cowrie default (`svr04`) is the first thing fingerprinting scripts look for.
# Keep it identical to /etc/hostname in cowrie/fs.pickle (scripts/build-cowrie-fs.py).
hostname = web-prod-02

[shell]
filesystem = /cowrie/cowrie-git/custom/fs.pickle
# What `ssh -V` prints inside the fake shell. The Cowrie default (OpenSSH 7.9 / 2018)
# contradicted the banner below, which already announces Debian 12's OpenSSH 9.2.
ssh_version = OpenSSH_9.2p1 Debian-2+deb12u3, OpenSSL 3.0.15 3 Sep 2024

[ssh]
# Banner sent to clients: must stay a Debian 12 (bookworm) OpenSSH, like the kernel
# string kept from the Cowrie default (6.1.0-21-amd64 = Debian 12).
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3
