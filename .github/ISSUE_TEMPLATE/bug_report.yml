name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not paste secrets, your server's IP, host.env or .env values. Security issues go to the
        private advisory form (see SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - install-host.sh / host scripts
        - Ingestion (Cowrie, fail2ban, sshd)
        - Dashboard (backend API)
        - Dashboard (frontend)
        - Docker / compose
        - Documentation
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output or logs
      description: installer output, `docker compose logs --tail=50 dashboard`, browser console. Redact addresses.
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: Debian 12, Docker 27, commit abc1234
